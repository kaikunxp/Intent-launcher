name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > debug.keystore
            echo "Using keystore from DEBUG_KEYSTORE_BASE64 secret"
          elif [ -f .github/signing/ci-debug.keystore ]; then
            cp .github/signing/ci-debug.keystore debug.keystore
            echo "Using persistent repository CI keystore (.github/signing/ci-debug.keystore)"
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Using repository debug.keystore.base64"
          else
            echo "::error::No persistent signing keystore found. Refusing to generate a random certificate."
            exit 1
          fi
          keytool -list -keystore debug.keystore -storepass android | grep -E "Alias name:|Certificate fingerprint"

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Optimized Release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/ci-release.keystore
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: |
          cp debug.keystore "$KEYSTORE_PATH"
          keytool -changealias \
            -keystore "$KEYSTORE_PATH" \
            -storepass android \
            -alias androiddebugkey \
            -destalias upload
          gradle :app:assembleRelease
          rm -f "$KEYSTORE_PATH"

      - name: Prepare named APK
        id: meta
        run: |
          VERSION_NAME=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          mkdir -p build-release
          APK_OUT="build-release/ButtonIntentLauncher-v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_OUT"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner | sort -V | tail -n1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_OUT"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ButtonIntentLauncher-APK
          path: build-release/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-{1}', steps.meta.outputs.version, github.run_number) }}
          name: Button Intent Launcher ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.meta.outputs.version) }}
          files: build-release/*.apk
